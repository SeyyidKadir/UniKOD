<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>UniKOD — API Reference</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080c14;--panel:#0e1420;--panel2:#131929;--border:#1e2d45;--text:#d4e2f4;--mu:#4a6280;--accent:#4f9eff;--accent2:#a78bfa;--grn:#34d399;--red:#f87171;--yellow:#fbbf24;--orange:#fb923c;--titlebar:#0a1018;}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}

/* HEADER */
.hdr{background:var(--titlebar);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:200;backdrop-filter:blur(10px)}
.logo{font-size:18px;font-weight:800;letter-spacing:-1px;white-space:nowrap}
.logo em{color:var(--accent);font-style:normal}
.logo small{font-size:10px;color:var(--mu);font-weight:400;margin-left:5px}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.search{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 12px;font-size:12px;width:180px;font-family:'Sora',sans-serif}
.search:focus{outline:none;border-color:var(--accent)}
.search::placeholder{color:var(--mu)}
.menu-btn{display:none;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:7px 10px;cursor:pointer;font-size:16px}

/* DİL BAR */
.lang-bar{background:var(--panel);border-bottom:1px solid var(--border);padding:7px 20px;display:flex;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.lang-bar::-webkit-scrollbar{height:3px}
.lang-bar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.lbtn{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--mu);cursor:pointer;font-size:11px;font-family:'Sora',sans-serif;white-space:nowrap;transition:all .15s;flex-shrink:0}
.lbtn:hover{color:var(--text);border-color:var(--accent)}
.lbtn.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700}

/* LAYOUT */
.layout{display:flex;flex:1;min-height:0;position:relative}

/* SIDEBAR */
.sidebar{width:230px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;position:sticky;top:89px;height:calc(100vh - 89px);transition:transform .3s ease;z-index:150}
.sb-section{padding:12px 0 4px}
.sb-title{font-size:10px;font-weight:700;color:var(--mu);padding:0 16px 5px;text-transform:uppercase;letter-spacing:1.5px}
.sb-item{display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:12px;cursor:pointer;color:var(--mu);border-left:2px solid transparent;transition:all .1s;text-decoration:none}
.sb-item:hover{background:var(--panel2);color:var(--text)}
.sb-item.active{background:var(--panel2);color:var(--accent);border-left-color:var(--accent)}
.sb-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sb-close{display:none;position:absolute;top:10px;right:10px;background:var(--border);border:none;color:var(--text);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px;align-items:center;justify-content:center}

/* OVERLAY */
.overlay{display:none;position:fixed;inset:0;background:#00000080;z-index:140;backdrop-filter:blur(2px)}
.overlay.open{display:block}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:28px 32px;min-width:0}

/* HERO */
.hero{margin-bottom:40px;padding-bottom:28px;border-bottom:1px solid var(--border)}
.hero h1{font-size:32px;font-weight:800;letter-spacing:-1px;margin-bottom:6px}
.hero h1 em{color:var(--accent);font-style:normal}
.hero p{font-size:13px;color:var(--mu);line-height:1.7;max-width:560px}
.v-badge{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:3px 12px;font-size:11px;color:var(--mu);margin-bottom:14px}
.v-badge span{color:var(--grn);font-weight:700}

/* SECTION */
.section{margin-bottom:48px}
.sec-hdr{display:flex;align-items:center;gap:10px;margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.sec-icon{font-size:20px}
.sec-title{font-size:20px;font-weight:800;letter-spacing:-.5px}

/* ENTRY */
.entry{background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden}
.entry:hover{border-color:var(--accent)44}
.entry-head{padding:12px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.entry-name{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--accent)}
.entry-sig{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mu)}
.entry-tags{margin-left:auto;display:flex;gap:5px;flex-shrink:0}
.tag{padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.5px}
.tag-fn{background:#1a2d4a;color:var(--accent)}
.tag-oz{background:#1a3d2b;color:var(--grn)}
.tag-olay{background:#3d2b1a;color:var(--orange)}
.tag-tip{background:#2d1a3d;color:var(--accent2)}
.tag-kw{background:#3d3a1a;color:var(--yellow)}
.entry-body{padding:0 16px 16px;border-top:1px solid var(--border)}
.entry-desc{font-size:13px;color:var(--mu);margin:10px 0 8px;line-height:1.6}

/* PARAMS */
.pt{font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:1px;margin:12px 0 5px}
.pr{display:flex;align-items:baseline;gap:8px;padding:4px 0;border-bottom:1px solid var(--border)22;flex-wrap:wrap}
.pn{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--yellow);min-width:90px}
.pty{font-size:11px;color:var(--accent2);min-width:70px}
.pd{font-size:12px;color:var(--mu)}
.ret{display:flex;align-items:center;gap:7px;margin:8px 0;font-size:12px}
.rl{color:var(--mu);font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;white-space:nowrap}
.rt{font-family:'JetBrains Mono',monospace;color:var(--accent2)}
.rd{color:var(--mu)}

/* TRANS */
.trans-grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tc{display:flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:3px 8px;font-size:11px}
.tf{font-size:12px}
.tk{font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:700}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}
.tbl th{text-align:left;padding:6px 10px;background:var(--panel2);color:var(--mu);font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700}
.tbl td{padding:6px 10px;border-bottom:1px solid var(--border)44}
.tbl td:first-child{font-family:'JetBrains Mono',monospace;color:var(--accent)}
.tbl td:nth-child(2){color:var(--accent2)}
.tbl td:nth-child(3){color:var(--mu)}

/* CODE */
.cb{background:#050810;border:1px solid var(--border);border-radius:7px;padding:12px 14px;margin:10px 0;overflow-x:auto;position:relative}
.cb pre{font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.7;color:var(--text)}
.cl{position:absolute;top:7px;right:9px;font-size:10px;color:var(--mu);font-family:'JetBrains Mono',monospace}
.kw{color:var(--accent2);font-weight:700}
.fn{color:var(--accent)}
.str{color:var(--grn)}
.num{color:var(--orange)}
.cm{color:var(--mu);font-style:italic}
.type{color:var(--yellow)}

/* MOBILE */
@media(max-width:768px){
  .sidebar{position:fixed;top:0;left:0;height:100vh;transform:translateX(-100%);box-shadow:4px 0 20px #00000060}
  .sidebar.open{transform:translateX(0)}
  .sb-close{display:flex}
  .menu-btn{display:block}
  .content{padding:16px}
  .hero h1{font-size:22px}
  .search{width:130px}
  .hdr{padding:10px 14px}
  .lang-bar{padding:6px 14px}
}
</style>
</head>
<body>

<div class="hdr">
  <button class="menu-btn" onclick="toggleSidebar()">☰</button>

    <input class="search" type="text" id="searchInput" placeholder="🔍 Search..." oninput="doSearch(this.value)">
  </div>
</div>

<div class="lang-bar" id="langBar"></div>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<div class="layout">
  <div class="sidebar" id="sidebar">
    <button class="sb-close" onclick="closeSidebar()">✕</button>
    <div id="sbContent"></div>
  </div>
  <div class="content" id="content"></div>
</div>

   code:`<span class="kw">#TR</span>\n<span class="type">Sayi</span> x = <span class="num">5</span>;\n<span class="fn">Yaz</span>(x);\n\n<span class="cm">// Karma dil — aynı projede</span>\n<span class="kw">#EN</span>\n<span class="kw">Function</span> Add(a, b)\n  <span class="kw">Return</span> a + b;\n<span class="kw">EndFunction</span>`},
]},
];}

// ══════════════════════════════════════════════
var _lang='tr', _search='';

function transChips(langs){
  if(!langs||!langs.length) return '';
  var h='';
  Object.keys(LANGS).forEach(function(lk){
    var words=langs.map(function(k){return TR[lk]&&TR[lk][k]?TR[lk][k]:null;}).filter(Boolean).join(' / ');
    if(words) h+='<span class="tc"><span class="tf">'+LANGS[lk].flag+'</span><span class="tk">'+words+'</span></span>';
  });
  return h;
}

function renderEntry(e){
  var k=kw(e.key);
  var sig=e.params&&e.params.length?'('+e.params.map(function(p){return p.n;}).join(', ')+')':'';
  var h='<div class="entry"><div class="entry-head"><span class="entry-name">'+k+'</span>';
  if(sig) h+='<span class="entry-sig">'+sig+'</span>';
  h+='<div class="entry-tags"><span class="tag tag-'+e.tag+'">'+e.tag.toUpperCase()+'</span></div></div>';
  h+='<div class="entry-body"><div class="entry-desc">'+desc(e.key)+'</div>';
  if(e.params&&e.params.length){
    h+='<div class="pt">'+pl('params')+'</div>';
    e.params.forEach(function(p){h+='<div class="pr"><span class="pn">'+p.n+'</span><span class="pty">'+p.t+'</span><span class="pd">'+p.d+'</span></div>';});
  }
  if(e.ret&&e.ret.type&&e.ret.type!=='—'){
    h+='<div class="ret"><span class="rl">'+pl('returns')+'</span><span class="rt">'+e.ret.type+'</span><span class="rd">'+e.ret.desc+'</span></div>';
  }
  if(e.props&&e.props.length){
    h+='<div class="pt">'+pl('props')+'</div><table class="tbl"><tr><th>'+pl('props')+'</th><th>Tip</th><th>—</th></tr>';
    e.props.forEach(function(p){h+='<tr><td>.'+p.n+'</td><td>'+p.t+'</td><td>'+p.d+'</td></tr>';});
    h+='</table>';
  }
  if(e.methods&&e.methods.length){
    h+='<div class="pt">'+pl('methods')+'</div><table class="tbl"><tr><th>Metod</th><th>—</th></tr>';
    e.methods.forEach(function(m){h+='<tr><td>.'+m.n+'</td><td>'+m.d+'</td></tr>';});
    h+='</table>';
  }
  if(e.langs&&e.langs.length){
    h+='<div class="pt">'+pl('translations')+'</div><div class="trans-grid">'+transChips(e.langs)+'</div>';
  }
  if(e.code){
    h+='<div class="pt">'+pl('example')+'</div><div class="cb"><span class="cl">UniKOD</span><pre>'+e.code+'</pre></div>';
  }
  h+='</div></div>';
  return h;
}

function renderAll(){
  var data=getData();
  var c=document.getElementById('content');
  var heroDesc={
    tr:'Tüm built-in fonksiyonlar, veri tipleri, GUI nesneleri ve direktifler. 6 dilde.',
    en:'All built-in functions, data types, GUI objects and directives. In 6 languages.',
    de:'Alle eingebauten Funktionen, Datentypen, GUI-Objekte und Direktiven. In 6 Sprachen.',
    fr:'Toutes les fonctions intégrées, types de données, objets GUI et directives. En 6 langues.',
    es:'Todas las funciones integradas, tipos de datos, objetos GUI y directivas. En 6 idiomas.',
    id:'Semua fungsi bawaan, tipe data, objek GUI dan direktif. Dalam 6 bahasa.'
  };
  var h='<div class="hero"><div class="v-badge">UniKOD <span>v1.0</span> — API Reference</div><h1>Uni<em>KOD</em> API</h1><p>'+(heroDesc[_lang]||heroDesc.tr)+'</p></div>';
  data.forEach(function(sec){
    var entries=sec.entries.filter(function(e){
      if(!_search) return true;
      var k=(kw(e.key)||'').toLowerCase();
      var d=(desc(e.key)||'').toLowerCase();
      return k.includes(_search)||d.includes(_search)||e.key.toLowerCase().includes(_search);
    });
    if(!entries.length) return;
    h+='<div class="section" id="sec_'+sec.id+'">';
    h+='<div class="sec-hdr"><span class="sec-icon">'+sec.icon+'</span><div class="sec-title">'+st(sec.id)+'</div></div>';
    entries.forEach(function(e){h+=renderEntry(e);});
    h+='</div>';
  });
  c.innerHTML=h;
  renderSidebar(data);
}

function renderSidebar(data){
  var colors={fn:'#4f9eff',oz:'#34d399',olay:'#fb923c',tip:'#a78bfa',kw:'#fbbf24'};
  var h='';
  data.forEach(function(sec){
    h+='<div class="sb-section"><div class="sb-title">'+sec.icon+' '+st(sec.id)+'</div>';
    sec.entries.forEach(function(e){
      h+='<a class="sb-item" href="#sec_'+sec.id+'" onclick="jumpTo(\''+sec.id+'\');return false;"><span class="sb-dot" style="background:'+colors[e.tag]+'"></span>'+kw(e.key)+'</a>';
    });
    h+='</div>';
  });
  document.getElementById('sbContent').innerHTML=h;
}

function jumpTo(id){
  var el=document.getElementById('sec_'+id);
  if(el){el.scrollIntoView({behavior:'smooth'});}
  closeSidebar();
}

function setLang(l){
  _lang=l;
  document.querySelectorAll('.lbtn').forEach(function(b){b.classList.toggle('active',b.dataset.lang===l);});
  renderAll();
}

function doSearch(v){
  _search=v.toLowerCase().trim();
  renderAll();
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

window.onload=function(){
  var bar=document.getElementById('langBar');
  Object.keys(LANGS).forEach(function(lk){
    var b=document.createElement('button');
    b.className='lbtn'+(lk===_lang?' active':'');
    b.dataset.lang=lk;
    b.textContent=LANGS[lk].flag+' '+LANGS[lk].name;
    b.onclick=function(){setLang(lk);};
    bar.appendChild(b);
  });
  renderAll();
};
</script>
</body>
</html>
